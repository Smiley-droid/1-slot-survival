name: Test serveurs 26.3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  paper:
    name: Paper 26.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Compiler le plugin
        run: mvn -B -q -f paper/pom.xml package || true
      - name: Lancer Paper 26.3 et tester les commandes
        run: |
          mkdir -p srv/plugins
          cp paper/target/1-slot-survival-paper-*.jar srv/plugins/ || echo "pas de jar"
          python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request("https://fill.papermc.io/v3/projects/paper/versions/26.3/builds", headers={"User-Agent":"slot-survival-ci"})
          builds = json.load(urllib.request.urlopen(req))
          b = builds[0]
          url = b["downloads"]["server:default"]["url"]
          print("build", b.get("id"), b.get("channel"), url)
          open("srv/paper.jar","wb").write(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"slot-survival-ci"})).read())
          PY
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nview-distance=2\nsimulation-distance=2\n' > srv/server.properties
          export CMDS='plugins|slotsurvival|slotsurvival status|slotsurvival selftest|slotsurvival pause|slotsurvival enable|slotsurvival offhand on|slotsurvival offhand off|slotsurvival uninstall'
          ci/run_server.sh srv java -Xmx1G -jar paper.jar --nogui > paper-out.txt 2>&1 || true
          python3 - <<'PY'
          import re
          t = open("paper-out.txt").read()
          keep = [l for l in t.splitlines() if re.search(r"slotsurvival|SlotSurvival|1 SLOT|ERROR|Exception|Caused|WARN|Unknown|Done \(|Paper|plugins|Could not|NoSuch|Error|selftest|PASS|FAIL", l)]
          msg = "\n".join(keep[:60]).replace("%","%25").replace("\r","").replace("\n","%0A")
          print("::error title=PAPER-LOG::" + msg[:6000])
          PY

  fabric:
    name: Fabric 26.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Lancer Fabric 26.3 et tester les fonctions
        run: |
          mkdir -p srv/mods
          (cd fabric/src && zip -q -r ../../srv/mods/1-slot-survival-fabric.jar .)
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          H = {"User-Agent":"slot-survival-ci"}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u, headers=H)).read()
          loader = [x for x in json.loads(get("https://meta.fabricmc.net/v2/versions/loader")) if x.get("stable")][0]["version"]
          inst = [x for x in json.loads(get("https://meta.fabricmc.net/v2/versions/installer")) if x.get("stable")][0]["version"]
          print("loader", loader, "installer", inst)
          open("srv/fabric.jar","wb").write(get(f"https://meta.fabricmc.net/v2/versions/loader/26.3/{loader}/{inst}/server/jar"))
          q = "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=" + urllib.parse.quote('["26.3"]') + "&loaders=" + urllib.parse.quote('["fabric"]')
          v = json.loads(get(q))[0]
          f = v["files"][0]
          print("fabric-api", v["version_number"])
          open("srv/mods/"+f["filename"],"wb").write(get(f["url"]))
          PY
          export CMDS='function slot_lock:admin/pause|scoreboard players get #enabled sl_cfg|function slot_lock:admin/enable|scoreboard players get #enabled sl_cfg|summon minecraft:armor_stand 0 100 0 {Tags:["t"],NoGravity:1b}|item replace entity @e[tag=t,limit=1] weapon.mainhand with minecraft:diamond 5|execute as @e[tag=t,limit=1] at @s run function slot_lock:fix {slot:"weapon.mainhand",path:"equipment.mainhand"}|data get entity @e[tag=t,limit=1] equipment.mainhand.id|data get entity @e[tag=t,limit=1] equipment.mainhand.components|data get entity @e[type=item,limit=1] Item.id|data get entity @e[type=item,limit=1] Item.count|item replace entity @e[tag=t,limit=1] weapon.offhand with minecraft:air|execute as @e[tag=t,limit=1] at @s run function slot_lock:fix {slot:"weapon.offhand",path:"equipment.offhand"}|data get entity @e[tag=t,limit=1] equipment.offhand.id|datapack list'
          ci/run_server.sh srv java -Xmx1G -jar fabric.jar nogui > fabric-out.txt 2>&1 || true
          python3 - <<'PY'
          import re
          t = open("fabric-out.txt").read()
          keep = [l for l in t.splitlines() if re.search(r"slot|Slot|SLOT|ERROR|Exception|Caused|WARN|Unknown|Done \(|mod|Fabric|has \d|function|datapack|Could not|Error|System chat", l)]
          msg = "\n".join(keep[:70]).replace("%","%25").replace("\r","").replace("\n","%0A")
          print("::error title=FABRIC-LOG::" + msg[:6000])
          PY
